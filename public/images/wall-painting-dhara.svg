<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#5ea0d6"/>
      <stop offset="60%" stopColor="#8cbce6"/>
      <stop offset="100%" stopColor="#cce2f5"/>
    </linearGradient>

    <!-- Clay Brick Pattern -->
    <pattern id="brickWall" width="48" height="20" patternUnits="userSpaceOnUse">
      <rect width="48" height="20" fill="#a8432a"/>
      <line x1="0" y1="0" x2="48" y2="0" stroke="#682515" stroke-width="2"/>
      <line x1="0" y1="10" x2="48" y2="10" stroke="#682515" stroke-width="2"/>
      <line x1="24" y1="0" x2="24" y2="10" stroke="#682515" stroke-width="2"/>
      <line x1="0" y1="10" x2="0" y2="20" stroke="#682515" stroke-width="2"/>
      <line x1="48" y1="10" x2="48" y2="20" stroke="#682515" stroke-width="2"/>
      <!-- color variations in bricks -->
      <rect x="2" y="2" width="20" height="7" fill="#bc4c32" opacity="0.6"/>
      <rect x="26" y="12" width="20" height="7" fill="#8f321d" opacity="0.5"/>
    </pattern>

    <!-- Dhara Orange Gradient -->
    <linearGradient id="dharaAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f59e0b"/>
      <stop offset="60%" stopColor="#ea580c"/>
      <stop offset="100%" stopColor="#d97706"/>
    </linearGradient>

    <!-- Red Plastic Jerry Can 3D Gradient -->
    <linearGradient id="redPlastic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ef4444"/>
      <stop offset="25%" stopColor="#dc2626"/>
      <stop offset="70%" stopColor="#b91c1c"/>
      <stop offset="100%" stopColor="#7f1d1d"/>
    </linearGradient>

    <!-- Gold Refined Can 3D Gradient -->
    <linearGradient id="goldPlastic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="30%" stopColor="#eab308"/>
      <stop offset="75%" stopColor="#ca8a04"/>
      <stop offset="100%" stopColor="#854d0e"/>
    </linearGradient>

    <!-- Sidewalk interlocking pavers -->
    <linearGradient id="pavers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#d4c9b8"/>
      <stop offset="50%" stopColor="#baac97"/>
      <stop offset="100%" stopColor="#968774"/>
    </linearGradient>
  </defs>

  <!-- 1. SKY & CLOUDS -->
  <rect width="1600" height="680" fill="url(#skyGrad)"/>
  <ellipse cx="280" cy="40" rx="140" ry="24" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="1180" cy="35" rx="160" ry="28" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="1380" cy="50" rx="90" ry="20" fill="#ffffff" opacity="0.6"/>

  <!-- 2. TOP ROOF STRUCTURE -->
  <rect x="750" y="20" width="260" height="90" fill="url(#brickWall)"/>
  <rect x="740" y="16" width="280" height="10" fill="#64748b"/>
  <rect x="760" y="26" width="50" height="80" fill="#38bdf8" opacity="0.7"/>

  <!-- 3. TOP BRICK WALL WITH CONCRETE BEAMS -->
  <rect x="0" y="95" width="1600" height="145" fill="url(#brickWall)"/>
  <!-- Concrete Columns & Lintel -->
  <rect x="0" y="205" width="1600" height="35" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="95" width="24" height="145" fill="#cbd5e1"/>
  <rect x="430" y="95" width="24" height="145" fill="#cbd5e1"/>
  <rect x="790" y="95" width="24" height="145" fill="#cbd5e1"/>
  <rect x="1420" y="95" width="24" height="145" fill="#cbd5e1"/>

  <!-- 4. WHITE PAINTED BRICK MURAL WALL -->
  <rect x="50" y="240" width="1380" height="340" fill="#f8fafc"/>
  <!-- Black framing boundary -->
  <rect x="45" y="235" width="1390" height="350" fill="none" stroke="#0f172a" stroke-width="12"/>
  <!-- Center vertical divider -->
  <line x1="1030" y1="235" x2="1030" y2="585" stroke="#0f172a" stroke-width="10"/>

  <!-- ============================================== -->
  <!-- LEFT PANEL: DHARA KACHI GHANI MUSTARD OIL      -->
  <!-- ============================================== -->
  <!-- Flowing Orange Graphic Wave -->
  <path d="M50 240 H800 C620 240 540 450 820 580 H50 V240 Z" fill="url(#dharaAmber)"/>
  <path d="M50 490 Q220 490 380 580 H50 Z" fill="#f8fafc"/>

  <!-- "Dhārā" Green Brand Typography -->
  <g transform="translate(190, 360)">
    <text x="0" y="0" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-style="italic" font-size="94" fill="#064e3b" letter-spacing="2">
      Dhārā
    </text>
    <text x="290" y="-55" font-family="sans-serif" font-weight="bold" font-size="28" fill="#064e3b">®</text>
    <text x="45" y="65" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="800" font-size="48" fill="#064e3b">
      एक अच्छा तेल
    </text>
  </g>

  <!-- Left Bottom Tagline & Veg Symbol -->
  <g transform="translate(80, 555)">
    <!-- Veg Square Box -->
    <rect x="0" y="-18" width="20" height="20" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="10" cy="-8" r="5" fill="#16a34a"/>
    <text x="28" y="-2" font-family="'Mukta', sans-serif" font-weight="700" font-size="16" fill="#0f172a">
      स्वाद, सेहत और भरोसे का साथ
    </text>
  </g>

  <!-- 3D RED 15-LITRE JERRY CAN (DHARA KACHI GHANI) -->
  <g transform="translate(680, 275)">
    <!-- Soft shadow on wall -->
    <ellipse cx="90" cy="275" rx="95" ry="14" fill="#0f172a" opacity="0.35"/>
    <!-- Red Plastic Body -->
    <path d="M30 55 Q10 65 10 90 V245 Q10 268 35 268 H145 Q170 268 170 245 V90 Q170 65 150 55 H115 V22 H65 V55 Z" fill="url(#redPlastic)"/>
    <!-- Hollow handle hole -->
    <path d="M125 100 V210 Q125 224 138 220 Q150 216 150 200 V110 Q150 96 138 96 Q125 96 125 100 Z" fill="#f8fafc"/>
    <!-- Cap on top -->
    <rect x="70" y="8" width="40" height="18" rx="3" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <line x1="75" y1="14" x2="105" y2="14" stroke="#fca5a5" stroke-width="2"/>
    <!-- Label -->
    <rect x="32" y="110" width="88" height="120" rx="8" fill="#ffffff" stroke="#fef08a" stroke-width="2"/>
    <text x="76" y="132" text-anchor="middle" font-family="'Times New Roman', serif" font-weight="bold" font-style="italic" font-size="19" fill="#064e3b">Dhārā</text>
    <text x="76" y="146" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#dc2626">Kachi Ghani</text>
    <text x="76" y="157" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="9" fill="#064e3b">Mustard Oil</text>
    <ellipse cx="76" cy="186" rx="20" ry="10" fill="#ca8a04"/>
    <circle cx="76" cy="175" r="5" fill="#f59e0b"/>
    <!-- 15L Red Badge -->
    <circle cx="48" cy="214" r="8" fill="#dc2626"/>
    <text x="48" y="217" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="8" fill="#ffffff">15</text>
    <text x="48" y="224" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#ffffff">LTR</text>
  </g>

  <!-- SR 65 CAMPAIGN STENCIL CODE & HINDI SLOGAN -->
  <g transform="translate(970, 460)">
    <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="34" fill="#0f172a">SR</text>
    <text x="0" y="32" font-family="sans-serif" font-weight="900" font-size="34" fill="#0f172a">65</text>
    <text x="0" y="58" font-family="'Mukta', sans-serif" font-weight="800" font-size="16" fill="#0f172a">शुद्धता</text>
    <text x="0" y="75" font-family="'Mukta', sans-serif" font-weight="800" font-size="16" fill="#0f172a">का भरोसा</text>
    <text x="0" y="92" font-family="'Mukta', sans-serif" font-weight="800" font-size="15" fill="#0f172a">हर रसोई में</text>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT PANEL: DHARA REFINED SOYABEAN OIL        -->
  <!-- ============================================== -->
  <path d="M1030 240 H1300 C1200 240 1170 450 1300 580 H1030 V240 Z" fill="url(#dharaAmber)"/>
  <path d="M1030 490 Q1140 490 1220 580 H1030 Z" fill="#f8fafc"/>

  <!-- Right Typography -->
  <g transform="translate(1100, 320)">
    <text x="0" y="0" font-family="'Times New Roman', serif" font-weight="900" font-style="italic" font-size="64" fill="#064e3b" letter-spacing="2">
      Dhārā
    </text>
    <text x="200" y="-36" font-family="sans-serif" font-weight="bold" font-size="20" fill="#064e3b">®</text>
    <text x="20" y="48" font-family="'Mukta', sans-serif" font-weight="800" font-size="36" fill="#064e3b">
      एक अच्छा तेल
    </text>
  </g>

  <!-- 3D GOLD 15-LITRE JERRY CAN (DHARA REFINED) -->
  <g transform="translate(1140, 360)">
    <ellipse cx="85" cy="190" rx="75" ry="12" fill="#0f172a" opacity="0.3"/>
    <path d="M30 40 Q10 48 10 68 V168 Q10 188 35 188 H140 Q165 188 165 168 V68 Q165 48 145 40 H115 V15 H65 V40 Z" fill="url(#goldPlastic)"/>
    <path d="M120 70 V145 Q120 155 132 152 Q144 148 144 136 V80 Q144 70 132 70 Q120 70 120 70 Z" fill="#f8fafc"/>
    <rect x="70" y="5" width="40" height="14" rx="3" fill="#ea580c"/>
    <!-- Label -->
    <rect x="32" y="75" width="80" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="72" y="96" text-anchor="middle" font-family="'Times New Roman', serif" font-weight="bold" font-style="italic" font-size="16" fill="#064e3b">Dhārā</text>
    <text x="72" y="109" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ea580c">Refined</text>
    <text x="72" y="120" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#064e3b">Soyabean Oil</text>
    <circle cx="45" cy="144" r="6" fill="#ea580c"/>
    <text x="45" y="147" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="6" fill="#ffffff">15</text>
  </g>

  <!-- Right Bottom Tagline -->
  <g transform="translate(1250, 565)">
    <text x="0" y="0" font-family="'Mukta', sans-serif" font-weight="700" font-size="14" fill="#0f172a">
      स्वाद, सेहत और भरोसे का साथ
    </text>
    <rect x="175" y="-14" width="16" height="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="183" cy="-6" r="4" fill="#16a34a"/>
  </g>

  <!-- 5. FOREGROUND SIDEWALK PAVERS -->
  <rect x="0" y="585" width="1600" height="95" fill="url(#pavers)"/>
  <line x1="0" y1="615" x2="1600" y2="615" stroke="#78716c" stroke-width="2"/>
  <line x1="0" y1="645" x2="1600" y2="645" stroke="#78716c" stroke-width="2"/>

  <!-- 6. STREET FURNITURE: PARK BENCH & TRASH POT (EXACTLY AS IN USER'S PHOTO) -->
  <!-- Fluted Red & Yellow Planter/Trash Pot -->
  <g transform="translate(290, 525)">
    <ellipse cx="18" cy="60" rx="16" ry="5" fill="#0f172a" opacity="0.35"/>
    <path d="M0 60 L4 10 H32 L36 60 Z" fill="#b91c1c"/>
    <rect x="2" y="24" width="32" height="12" fill="#facc15"/>
    <ellipse cx="18" cy="10" rx="14" ry="5" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
  </g>

  <!-- Green Painted Public Park Bench with Concrete Legs -->
  <g transform="translate(340, 520)">
    <ellipse cx="80" cy="65" rx="85" ry="7" fill="#0f172a" opacity="0.4"/>
    <rect x="10" y="18" width="12" height="48" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="140" y="18" width="12" height="48" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Green Seating Slats -->
    <rect x="0" y="28" width="160" height="6.5" rx="1.5" fill="#059669" stroke="#047857" stroke-width="1"/>
    <rect x="0" y="38" width="160" height="6.5" rx="1.5" fill="#059669" stroke="#047857" stroke-width="1"/>
    <rect x="0" y="48" width="160" height="6.5" rx="1.5" fill="#059669" stroke="#047857" stroke-width="1"/>
    <!-- Bench Backrest Slats -->
    <rect x="2" y="8" width="156" height="7.5" rx="1.5" fill="#10b981" stroke="#059669" stroke-width="1"/>
    <rect x="2" y="18" width="156" height="7.5" rx="1.5" fill="#10b981" stroke="#059669" stroke-width="1"/>
  </g>

  <!-- Right Building Entrance Framing -->
  <rect x="1435" y="170" width="165" height="420" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="1455" y="275" width="130" height="310" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <rect x="1465" y="290" width="50" height="140" fill="#94a3b8" opacity="0.4"/>
  <rect x="1525" y="290" width="50" height="140" fill="#94a3b8" opacity="0.4"/>
  <rect x="1465" y="450" width="110" height="135" fill="#78350f" opacity="0.8"/>
</svg>
