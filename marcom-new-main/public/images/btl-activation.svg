<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="btlBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#4c0519"/>
      <stop offset="100%" stopColor="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#btlBg)"/>
  <rect x="0" y="520" width="1200" height="155" fill="#1e293b"/>

  <!-- Mall / Exhibition Pavilion Canopy Structure -->
  <polygon points="600,120 220,260 980,260" fill="#e11d48" stroke="#f43f5e" stroke-width="4"/>
  <rect x="260" y="260" width="680" height="260" fill="#1c1917" stroke="#e11d48" stroke-width="3"/>

  <!-- Canopy Valance Text -->
  <text x="600" y="235" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">
    ON-GROUND CONSUMER ENGAGEMENT PAVILION
  </text>

  <!-- Interactive Display Pods -->
  <rect x="310" y="300" width="160" height="180" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
  <text x="390" y="390" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fecdd3">SAMPLING</text>
  <text x="390" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Direct Tasting</text>

  <rect x="520" y="300" width="160" height="180" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
  <text x="600" y="390" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fecdd3">DEMO ARENA</text>
  <text x="600" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Live Interaction</text>

  <rect x="730" y="300" width="160" height="180" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
  <text x="810" y="390" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fecdd3">PROMO KIOSK</text>
