      <stop offset="0%" stopColor="#451a03"/>
      <stop offset="100%" stopColor="#0c0a09"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#eventBg)"/>
  
  <!-- Spotlights -->
  <polygon points="100,0 250,550 450,550" fill="#f59e0b" opacity="0.15"/>
  <polygon points="1100,0 950,550 750,550" fill="#f59e0b" opacity="0.15"/>

  <!-- Stage Platform -->
