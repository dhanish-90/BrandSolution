<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyOutdoor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#skyOutdoor)"/>
  <rect x="0" y="520" width="1200" height="155" fill="#0f172a"/>
  
  <!-- Highway Unipole Heavy Steel Pillar -->
  <rect x="575" y="340" width="50" height="220" fill="#64748b" stroke="#334155" stroke-width="3"/>

  <!-- Unipole Billboard Frame -->
  <rect x="180" y="100" width="840" height="260" rx="10" fill="#020617" stroke="#e2e8f0" stroke-width="6"/>

  <!-- Billboard Content -->
  <rect x="200" y="120" width="800" height="220" fill="#b91c1c"/>
  <text x="600" y="210" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">
    OUTDOOR HOARDINGS &amp; UNIPOLES
  </text>
  <text x="600" y="260" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="24" fill="#fef08a">
    PRIME NATIONAL HIGHWAYS &amp; CITY ARTERIAL JUNCTIONS
  </text>
  <text x="600" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">
    100% LEGAL MUNICIPAL PERMITS • FLOODLIT 24/7 VISIBILITY
  </text>

  <!-- Top Floodlights -->
  <circle cx="280" cy="90" r="10" fill="#fef08a"/>
  <circle cx="500" cy="90" r="10" fill="#fef08a"/>
  <circle cx="700" cy="90" r="10" fill="#fef08a"/>
  <circle cx="920" cy="90" r="10" fill="#fef08a"/>
</svg>
