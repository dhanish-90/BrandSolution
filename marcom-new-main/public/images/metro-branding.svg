<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="metroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1e3a8a"/>
      <stop offset="100%" stopColor="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#metroBg)"/>
  <rect x="0" y="540" width="1200" height="135" fill="#334155"/>

  <!-- Station Concourse Beam -->
  <rect x="0" y="80" width="1200" height="70" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">
    DELHI METRO NETWORK TRANSIT MEDIA
  </text>

  <!-- Large Illuminated Metro Station Wall Display -->
  <rect x="180" y="180" width="840" height="220" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="4"/>
  <text x="600" y="270" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="44" fill="#ffffff">
    METRO PILLARS &amp; CONCOURSE TAKEOVERS
  </text>
  <text x="600" y="325" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#93c5fd">
    HIGH DWELL-TIME URBAN COMMUTER SATURATION
  </text>

  <!-- Metro Cylindrical / Square Pillars Wrapped in Advertisements -->
  <rect x="240" y="420" width="130" height="160" rx="10" fill="#2563eb" stroke="#bfdbfe" stroke-width="3"/>
  <text x="305" y="505" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">PILLAR 12A</text>

  <rect x="535" y="420" width="130" height="160" rx="10" fill="#2563eb" stroke="#bfdbfe" stroke-width="3"/>
  <text x="600" y="505" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">PILLAR 12B</text>

  <rect x="830" y="420" width="130" height="160" rx="10" fill="#2563eb" stroke="#bfdbfe" stroke-width="3"/>
  <text x="895" y="505" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">PILLAR 12C</text>
</svg>
